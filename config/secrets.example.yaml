# The shared secrets file: every credential a box needs, and the only place
# they exist outside the sanctum account. Put it in place, fill it in, encrypt it,
# and the sanctum stack uploads it on the next apply:
#
#   mkdir -p secrets
#   cp config/secrets.example.yaml secrets/shared.sops.yaml
#   $EDITOR secrets/shared.sops.yaml
#   sops -e -i secrets/shared.sops.yaml
#
# After that, edit with `sops secrets/shared.sops.yaml` -- it decrypts into your
# $EDITOR and re-encrypts on save. sops encrypts values but leaves keys in the
# clear, so diffs stay readable and you can see what changed without decrypting.
#
# A per-box overlay at secrets/boxes/<box-name>.sops.yaml uses this same schema
# and is merged over this file on that box: objects merge key by key, lists
# replace wholesale. Use it to give one box different values -- not to isolate
# them: every box assumes the same sanctum role, so any box can read and decrypt
# any other box's overlay if it goes looking.
#
# secrets/ is gitignored. The sanctum account's bucket is versioned, so that is
# the backup, and rolling back a bad push is one object version away.

# Reusable, pre-authorized key: Tailscale admin console -> Settings -> Keys
tailscale_authkey: tskey-auth-...

# printf %s 'your-nuke-passphrase' | sha256sum | cut -d' ' -f1
nuke_passphrase_sha256: "..."

# Exported into the dev user's shells. Values are shell-quoted on the way to
# disk, so spaces and metacharacters are safe.
env:
  # Claude Code on the MAX SUBSCRIPTION: mint with `claude setup-token` on your
  # laptop. Do NOT also set ANTHROPIC_API_KEY -- that switches billing to API
  # credits.
  CLAUDE_CODE_OAUTH_TOKEN: ""
  OPENAI_API_KEY: ""
  GOOGLE_API_KEY: ""
  HF_TOKEN: ""
  # Optional non-interactive auth for the other agent CLIs (else log in once
  # over SSH): CURSOR_API_KEY, GEMINI_API_KEY

# Each profile gets an SSH host alias gh-<id> and owns /srv/projects/<id>/, so
# repos cloned there commit as that identity. The `profile` field on a projects
# entry in tfvars matches `id` here. Use dedicated ed25519 deploy keys, not your
# personal key.
git_profiles:
  - id: personal
    name: Your Name
    email: you@example.com
    ssh_key: |
      -----BEGIN OPENSSH PRIVATE KEY-----
      ...
      -----END OPENSSH PRIVATE KEY-----
